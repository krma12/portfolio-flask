# =============================================================
# GitHub Actions del portfolio
#   1. tests  -> corre las pruebas (incluidas las de seguridad) y revisa
#                vulnerabilidades en las dependencias, en cada push y pull request
#   2. sync   -> cada mañana agrega al portfolio publicado los repos
#                nuevos de GitHub, usando la API del propio portfolio
#   3. backup -> cada mañana descarga todos los proyectos en un JSON y lo
#                guarda 90 días (Actions → la ejecución → Artifacts)
#
# Configuración (una sola vez, en GitHub):
#   Settings → Secrets and variables → Actions
#     - Secret   PORTFOLIO_API_KEY = la misma clave del archivo WSGI
#     - Variable PORTFOLIO_URL     = https://hugoportfolio.pythonanywhere.com
# =============================================================
name: Portfolio

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 14 * * *"   # todos los días 14:00 UTC = 8:00 a. m. en CDMX
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
      # Revisa si alguna librería (Flask, SQLAlchemy…) tiene vulnerabilidades conocidas
      - name: Auditoría de dependencias
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Solo usa la librería estándar de Python: no necesita instalar nada
      - name: Agregar repos nuevos al portfolio
        env:
          PORTFOLIO_API_KEY: ${{ secrets.PORTFOLIO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # evita el límite de consultas de GitHub
        run: python sync_github.py --remoto "${{ vars.PORTFOLIO_URL }}"

  backup:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Solo lee la API pública: no necesita la clave
      - name: Descargar respaldo de los proyectos
        run: python respaldo.py descargar "${{ vars.PORTFOLIO_URL }}"
      - name: Guardar respaldo (90 días)
        uses: actions/upload-artifact@v7
        with:
          name: respaldo-proyectos
          path: respaldos/*.json
          retention-days: 90
